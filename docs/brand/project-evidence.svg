and</text><path d="M1226 385h30" stroke="#007F75" stroke-width="3"/><rect x="1256" y="300" width="264" height="170" rx="18" fill="#EAF2EE" stroke="#007F75" stroke-width="2" /><text x="1388" y="365" font-size="30" font-weight="600" fill="#17262D" text-anchor="middle">Target PC</text><text x="1388" y="407" font-size="30" font-weight="400" fill="#4D6267" text-anchor="middle">wake packet</text><text x="80" y="610" font-size="30" font-weight="400" fill="#4D6267" >Command success confirms packet dispatch. Startup depends on the target setup.</text><text x="78" y="852" font-size="24" font-weight="400" fill="#4D6267" >Raspberry Pi · Tailscale · Authenticated Flask API</text></g></svg>